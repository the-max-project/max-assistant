# Ollama configuration for Max-Assistant
# This file allows you to specify different parameters for various models

default_model: "gemma4:26B"
default:
  temperature: 0.0
  timeout: 120.0
  keep_alive: "-1"
  reasoning: True
  # Additional ChatOllama options can be passed here through the 'options' dict
  options:
    num_ctx: 32768

models:
  gemma4:12B:
    temperature: 0.0
    timeout: 180.0
    reasoning: True
    options:
      num_ctx: 16384
  llama3.1:8b-instruct:
    reasoning: False
  gemma4:26B:
    reasoning: True
  mistral:7b-instruct-v0.3-q5_K_M:
    reasoning: False

