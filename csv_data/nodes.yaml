- name: "Appointments"
  constraints:
  filename: "appointments.csv"
  query: |
        UNWIND $data AS row
        WITH row, 
             date() + duration.between(date('2025-11-03'), date(row.date)) AS calculatedDate       
        MERGE (a:Appointment {id: row.id})
        SET a.date = calculatedDate, 
            a.title = row.title, 
            a.time = localtime(row.time),
            a.duration = toInteger(row.duration),
            a.details = row.details
        RETURN count(*) as count
- name: "DailyRoutine"
  constraints:
  filename: "daily_routine.csv"
  query: |
    UNWIND $data AS row
    MERGE (r:DailyRoutine {id: row.id})
    SET r.title = row.title,
        r.type = row.type,
        r.dayOfWeek = [item in split(row.dayOfWeek, ',') | trim(item)],
        r.time = localtime(row.time),
        r.duration = toInteger(row.duration),
        r.startDate = CASE WHEN row.startDate IS NOT NULL AND row.startDate <> '' THEN date(row.startDate) ELSE null END,
        r.endDate = CASE WHEN row.endDate IS NOT NULL AND row.endDate <> '' THEN date(row.endDate) ELSE null END,
        r.room = row.room,
        r.details = row.details,
        r.rating = row.rating
    RETURN count(*) as count
- name: "Locations"
  constraints:
  filename: "locations.csv"
  query: |
    UNWIND $data AS row
    MERGE (l:Location {id: row.id})
    SET l.name = row.name, 
        l.address = row.address, 
        l.room = row.room, 
        l.type = row.type
    RETURN count(*) as count