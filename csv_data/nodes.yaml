- name: "person"
  filename: "persons.csv"
  constraints:
     - "CREATE CONSTRAINT IF NOT EXISTS FOR (p:Person) REQUIRE p.id IS UNIQUE"
  query: |
    UNWIND $data AS row
    MERGE (p:Person {id: row.id})
    SET p.firstName = row.firstName, 
        p.lastName = row.lastName, 
        p.gender = row.gender,
        p.dob = CASE WHEN row.dob IS NOT NULL AND row.dob <> '' THEN date(row.dob) ELSE null END,
        p.dod = CASE WHEN row.dod IS NOT NULL AND row.dod <> '' THEN date(row.dod) ELSE null END,
        p.phone = row.phone,
        p.email = row.email,
        p.notes = row.notes
    RETURN count(*) as count
- name: "person:user"
  constraints:
  filename: "user.csv"
  query: |
    UNWIND $data AS row
    MERGE (p:Person:User {id: toString(row.id)})
    ON CREATE SET 
        p.presence = 'present',
        p.sleep_state = 'awake'
    SET p.firstName = row.firstName, 
        p.lastName = row.lastName, 
        p.userName = row.userName,
        p.gender = row.gender,
        p.dob = CASE WHEN row.dob IS NOT NULL AND row.dob <> '' THEN date(row.dob) ELSE null END,
        p.dod = CASE WHEN row.dod IS NOT NULL AND row.dod <> '' THEN date(row.dod) ELSE null END,
        p.phone = row.phone,
        p.email = row.email,
        p.notes = row.notes
    RETURN count(*) as count
